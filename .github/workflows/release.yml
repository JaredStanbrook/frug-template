name: Release

# Tags a GitHub release. Deployment is separate — Cloudflare's Git integration
# deploys on push, not on tag.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
