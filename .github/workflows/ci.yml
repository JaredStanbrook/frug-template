name: CI

# Checks only. Deployment is handled by Cloudflare's Git integration
# (Workers & Pages -> your Worker -> Settings -> Builds), which runs
# `npm run build` then `npm run deploy` on every push.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      # `npm run build` runs `wrangler types` first, so the generated
      # worker-configuration.d.ts exists before tsc needs it.
      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm run test
