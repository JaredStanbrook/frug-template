name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      # worker-configuration.d.ts is generated, not committed, but tsconfig
      # lists it under "types" — typecheck fails without this step.
      - name: Generate Wrangler types
        run: bunx wrangler types

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format

      - name: Typecheck
        run: bun run typecheck

      # `bun run test` (not `bun test`) — the latter uses Bun's own runner and
      # ignores the vitest script.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
