name: CI

# Checks only. Deployment is handled by Cloudflare's Git integration
# (Workers & Pages -> your Worker -> Settings -> Builds), which runs
# `npm run build` then `npm run deploy` on every push.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      # Runs only in the template repository, so it disappears in repos made
      # from it. The template once got configured for a real site by mistake,
      # which meant the next site inherited a live database id and its first
      # deploy migrated someone else's data.
      - name: Template placeholders intact
        if: github.repository == 'JaredStanbrook/frug-template'
        run: |
          missing=0
          for token in \
            '"name": "frug-app"' \
            '"database_name": "change-me-db"' \
            '"database_id": "00000000-0000-0000-0000-000000000000"' \
            '"id": "00000000000000000000000000000000"' \
            '"bucket_name": "change-me-files"'
          do
            if ! grep -qF "$token" wrangler.jsonc; then
              echo "::error::Missing placeholder in wrangler.jsonc: $token"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::The template must ship placeholders only. Configure the repo made FROM the template, not the template itself — otherwise the next site inherits a live database id."
            exit 1
          fi
          echo "Placeholders intact."

      # Template repo only. Every change is a release that sites built from
      # the template can upgrade to, so each pull request bumps frugal.json
      # and describes itself in CHANGELOG.md. See docs/template-versions.md.
      - name: Template version bumped and described
        if: github.repository == 'JaredStanbrook/frug-template'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version=$(node -p "require('./frugal.json').version")
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section for frugal.json's version."
            exit 1
          fi
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet --depth=1 origin "$BASE_REF"
            # Empty when the base predates frugal.json: the first versioned release.
            base=$(git show "origin/$BASE_REF:frugal.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0) || '{}').version" || true)
            if [ "$base" = "$version" ]; then
              echo "::error::frugal.json is still $version, as on $BASE_REF. Bump it: every template change is a release."
              exit 1
            fi
          fi
          echo "Template version $version."

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      # `npm run build` runs `wrangler types` first, so the generated
      # worker-configuration.d.ts exists before tsc needs it.
      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm run test
