name: Deploy

# Manual by default. Uncomment the `push` trigger once you trust CI to ship.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which wrangler environment to deploy"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  # push:
  #   branches: [main]

# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — Dashboard → Workers & Pages → Account ID
#
# JWT_SECRET is NOT needed here. It lives on the worker itself (set once with
# `wrangler secret put`) and survives deploys. See docs/provisioning.md.

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install
        run: bun install --frozen-lockfile

      # worker-configuration.d.ts is generated, not committed.
      - name: Generate Wrangler types
        run: bunx wrangler types

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Migrations run before the deploy so the new code never meets an old
      # schema. D1 migrations are forward-only — review the SQL in drizzle/
      # before shipping a destructive change.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            bunx wrangler d1 migrations apply DB --remote
          else
            bunx wrangler d1 migrations apply DB --remote --env staging
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            bunx wrangler deploy
          else
            bunx wrangler deploy --env staging
          fi
